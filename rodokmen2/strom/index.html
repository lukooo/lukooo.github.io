jáka (* 1874). Podle seznamu cestujících byla v USA už v letech 1889–1894. Roku 1901 připlula z Antverp lodí SS Friesland s dětmi Máriou (* 1892), Jánem (* 1895) a Annou (* 1899) za manželem do Pittsburghu. V USA zůstala natrvalo. Datum narození a rodiče podle MyHeritage; že jde o tutéž Máriu, není ve stromu výslovně uvedeno. Převzato z rodokmen1.webnode.cz, zatím neověřeno v matrice. Příjezd 27. 3. 1901 ověřen v originálním seznamu cestujících (Friesland z Antverp, str. 332, ř. 5–8: „Maria Galan Rojpák, 30“, v USA 1889–1894, k manželovi Petru Galanovi do Pittsburghu; děti Mária 9 a Ján 6 „narozeni v USA“, Anna 2).</title><rect x="1284" y="3452.25" width="236" height="16" rx="4" fill="#f4efe6" stroke="#e2d8c8"></rect><text x="1290" y="3464.25" font-size="10.5" fill="#5b4a3a"><tspan fill="#9a8a76">sestra · </tspan>Mária Ropjaková, provd. Gaľanová …</text></g><g class="tree-chip"><title>Vztah: Juraj Ropják (č. 26) → sestra Mária Ropjaková → manžel Peter Gaľan. * 1858; × Mária Ropjaková. Do USA poprvé roku 1886, roku 1897 se vrátil domů, roku 1898 znovu do USA (Pittsburgh), zřejmě natrvalo. Převzato z rodokmen1.webnode.cz, zatím neověřeno v matrice.</title><rect x="1284" y="3471.25" width="236" height="16" rx="4" fill="#f4efe6" stroke="#e2d8c8"></rect><text x="1290" y="3483.25" font-size="10.5" fill="#5b4a3a"><tspan fill="#9a8a76">sestra → manžel · </tspan>Peter Gaľan (* 1858)</text></g><g class="tree-chip"><title>Vztah: Juraj Ropják (č. 26) → sestra Anna Ropjaková. * 3. 5. 1878 Tarnov čp. 47; × Ján Grega; † 24. 7. 1949 Mansfield, Ohio (88 E 2nd St, tam bydlela 29 let), pohřbena 27. 7. 1949 na katolickém hřbitově v Mansfieldu – úmrtní list Ohio uvádí rodiče George Ropjak a Susanna Holda, tedy přímo rodiče Juraje (č. 52–53); MyHeritage měl chybně 24. 6. Sestra Juraje Ropjáka (* 1874). Roku 1920 se s dětmi Jánem (* 1902), Annou (* 1907), Zuzanou (* 1909) a Jurajem (* 1911) plavila lodí SS France za manželem do Mansfieldu, Ohio (100 Daisy Street). V USA zůstala natrvalo. t><rect x="960" y="3705.125" width="8" height="58" rx="3" fill="#6FCBB9"></rect><text x="976" y="3728.125" font-size="15" font-weight="600" fill="#3b2e22">Agnesa Ropjaková</text><text x="976" y="3748.125" font-size="12" fill="#7a6b5a">1908–1994 · prababička</text></a><g class="tree-chip"><title>Vztah: Agnesa Ropjaková (č. 13) → bratr Ján Ropják. * 16. 6. 1899 Tarnov čp. 47, okr. Bardejov; × 1926 Anna C. Šafčáková; † 24. 8. 1940 doma v Lakewoodu, 2058 Quail Avenue, Ohio, po nemoci páteře trvající od roku 1931 (pohřben na Calvary Cemetery v Clevelandu 28. 8. 1940) – podle úmrtního listu Ohio, který jmenuje rodiče George Ropjak a Suzan Grega (tedy č. 26 a 27) a manželku Mary Ropjak; datum narození tam „June 16 1899“. Rozpor: úmrtní list, census 1940 (Mary * 1905) i sňatkový index dcery Josephine (matka „Mary Sofcak“) jmenují manželku Mary, ne Annu; Mary Ropjak * 1905, dcera Johna Safcaka a Mary Harnak, se roku 1941 znovu vdala za Martina Vrsanského (index sňatků Ohio). 7. 9. 1923 připlul z Cherbourgu lodí Aquitania na Ellis Island (24letý) k strýci Adamu Gregovi, 151 Daisy Street, Mansfield, Ohio – příjezd ověřen v originálním seznamu cestujících (Ellis Island, seznam C 8, ř. 15: „Father: Mr. Ropjak Juraj in Tarnov 47“, cíl Mansfield, Ohio). Census 1930: Dowd Street, Lakewood, Ohio, bez práce, nemluvil anglicky. Zemřel ve věku 41 let, 2 měsíců a 9 dní (web uváděl 26. 8. 1940, úmrtní list 24. 8.). Ostatní údaje převzaty z rodokmen1.webnode.cz.</title><rect x="974" y="3769.125" width="236" height="16" rx="4" fill="#f4efe6" stroke="#e2d8c8"></rect><text x="980" y="3781.125" font-size="10.5" fill="#5b4a3a"><tspan fill="#9a8a76">bratr · </tspan>Ján Ropják (1899–1940)</text></g><g class="tree-chip"><title>Vztah: Agnesa Ropjaková (č. 13) → bratr Juraj Ropják. * 18. 12. 1902 Tarnov; dělník, později mechanik (Bolt Works); × 8. 9. 1925 Pittsburgh (Pensylvánie) Mary Fornadelová; † 17. 4. 1941 ve státní nemocnici v Limě (Bath Township, okres Allen, Ohio) na zápal plic a tuberkulózu, nemocný od roku 1935 – podle úmrtního listu Ohio (manželka Mrs. Mary Ropjak, bydliště Lakewood, narozen 18. 12. 1902 v „Trnově“, otec George Ropjak; jako matku nemocnice uvedla „Anna Grega“ – to bylo jméno jeho tety, skutečná matka byla Zuzana Gregová). 7. 10. 1933 podal v Clevelandu prohlášení o úmyslu získat americké občanství (snímek: bydliště 2107 Dowd St., Lakewood, dělník, výška 5 stop 5 palců, * 8. 12. 1902 Tarnov, sňatek s Mary 8. 9. 1925 v Pittsburghu, manželka * 3/1903 v Pensylvánii, děti Helen a John). Smuteční oznámení v novinách The Plain Dealer jmenuje manželku Mary a děti Helen a John. V USA George Ropjak. 17. 9. 1921 připlul z Le Havru lodí SS France do New Yorku (19letý, výška 1,65 m) k strýci Johnu Gregovi, Lily Street, Mansfield, Ohio – příjezd ověřen v originálním seznamu cestujících (Ellis Island, seznam 3, ř. 19: rodiče „Jurej Ropjak, Župa Šarišská, Tarnov“, cíl Mansfield, Ohio). Census 1930: 2068 Quail Avenue, Lakewood, Ohio. Pohřeb 21. 4. 1944 z kostela sv. Cyrila a Metoděje v Lakewoodu, pohřben na Calvary Cemetery v Clevelandu. Web uváděl úmrtí 17. 4. 1944 a pohřeb 21. 4. 1944, MyHeritage 20. 4. 1941 – úmrtní list rozhodl: 17. 4. 1941, pohřeb 21. 4. 1941. Ostatní údaje převzaty z rodokmen1.webnode.cz.</title><rect x="974" y="3788.125" width="236" height="16" rx="4" fill="#f4efe6" stroke="#e2d8c8"></rect><text x="980" y="3800.125" font-size="10.5" fill="#5b4a3a"><tspan fill="#9a8a76">bratr · </tspan>Juraj Ropják (1902–1941)</text></g><g class="tree-chip"><title>Vztah: Agnesa Ropjaková (č. 13) → bratr Juraj Ropják → manželka Mary Fornadelová → otec Andrew Fornadel. Otec Mary Fornadelové. Převzato z rodokmen1.webnode.cz, zatím neověřeno v matrice.</title><rect x="974" y="3807.125" width="236" height="16" rx="4" fill="#f4efe6" stroke="#e2d8c8"></rect><text x="980" y="3819.125" font-size="10.5" fill="#5b4a3a"><tspan fill="#9a8a76">bratr → otec · </tspan>Andrew Fornadel</text></g><g class="tree-chip"><title>Vztah: Agnesa Ropjaková (č. 13) → bra
