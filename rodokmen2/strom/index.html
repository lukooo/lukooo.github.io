ail Avenue, Lakewood, Ohio. Pohřeb 21. 4. 1944 z kostela sv. Cyrila a Metoděje v Lakewoodu, pohřben na Calvary Cemetery v Clevelandu. Rozpor v pramenech: web uvádí úmrtí 17. 4. 1944, MyHeritage 20. 4. 1941. Věk při úmrtí, který cituje web (38 let, 3 měsíce a 29 dní), odpovídá spíš roku 1941 – nutno ověřit v úmrtním záznamu. Převzato z rodokmen1.webnode.cz, zatím neověřeno v matrice.</title><rect x="974" y="3100.125" width="236" height="16" rx="4" fill="#f4efe6" stroke="#e2d8c8"></rect><text x="980" y="3112.125" font-size="10.5" fill="#5b4a3a"><tspan fill="#9a8a76">bratr · </tspan>Juraj Ropják (1902–1944)</text></g><g class="tree-chip"><title>Vztah: Agnesa Ropjaková (č. 13) → bratr Juraj Ropják → manželka Mary Fornadelová → otec Andrew Fornadel. Otec Mary Fornadelové. Převzato z rodokmen1.webnode.cz, zatím neověřeno v matrice.</title><rect x="974" y="3119.125" width="236" height="16" rx="4" fill="#f4efe6" stroke="#e2d8c8"></rect><text x="980" y="3131.125" font-size="10.5" fill="#5b4a3a"><tspan fill="#9a8a76">bratr → otec · </tspan>Andrew Fornadel</text></g><g class="tree-chip"><title>Vztah: Agnesa Ropjaková (č. 13) → bratr Juraj Ropják → manželka Mary Fornadelová. * 30. 3. 1903 Pensylvánie (v prameni „Soaf“); × asi 1925 Juraj Ropják; † 15. 9. 1989 Garfield Heights, Cuyahoga County, Ohio. Narodila se slovenským rodičům už v Americe (v prameni Mary Fornadela). Převzato z rodokmen1.webnode.cz, zatím neověřeno v matrice. Ve stromu „Koňařík Family Tree“ zapsána jako Maria Fornadela. Žila v Garfield Heights.</title><rect x="974" y="3138.125" width="236" height="16" rx="4" fill="#f4efe6" stroke="#e2d8c8"></rect><text x="980" y="3150.125" font-size="10.5" fill="#5b4a3a"><tspan fill="#9a8a76">bratr → manželka · </tspan>Mary Fornadelová, provd…</text></g><g class="tree-chip"><title>Vztah: Agnesa Ropjaková (č. 13) → bratr Juraj Ropják → dcera Helen Jane Ropjaková. * 25. 6. 1927 Cuyahoga County, Ohio; × Evo Francescangeli; † 31. 3. 2001. Manžel Evo Francescangeli. Převzato z rod
