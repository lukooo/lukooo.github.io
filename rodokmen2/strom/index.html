 Ohio, který jmenuje rodiče George Ropjak a Suzan Grega (tedy č. 26 a 27) a manželku Mary Ropjak; datum narození tam „June 16 1899“. Rozpor: úmrtní list, census 1940 (Mary * 1905) i sňatkový index dcery Josephine (matka „Mary Sofcak“) jmenují manželku Mary, ne Annu; Mary Ropjak * 1905, dcera Johna Safcaka a Mary Harnak, se roku 1941 znovu vdala za Martina Vrsanského (index sňatků Ohio). 7. 9. 1923 připlul z Cherbourgu lodí Aquitania na Ellis Island (24letý) k strýci Adamu Gregovi, 151 Daisy Street, Mansfield, Ohio – příjezd ověřen v originálním seznamu cestujících (Ellis Island, seznam C 8, ř. 15: „Father: Mr. Ropjak Juraj in Tarnov 47“, cíl Mansfield, Ohio). Census 1930: Dowd Street, Lakewood, Ohio, bez práce, nemluvil anglicky. Zemřel ve věku 41 let, 2 měsíců a 9 dní (web uváděl 26. 8. 1940, úmrtní list 24. 8.). Ostatní údaje převzaty z rodokmen1.webnode.cz.</title><rect x="974" y="5599.625" width="236" height="16" rx="4" fill="#f4efe6" stroke="#e2d8c8"></rect><text x="980" y="5611.625" font-size="10.5" fill="#5b4a3a"><tspan fill="#9a8a76">bratr · </tspan>Ján Ropják (1899–1940)</text></g><g class="tree-chip"><title>Vztah: Agnesa Ropjaková (č. 13) → bratr Juraj Ropják. * 18. 12. 1902 Tarnov; dělník, později mechanik (Bolt Works); × 8. 9. 1925 Pittsburgh (Pensylvánie) Mary Fornadelová; † 17. 4. 1941 ve státní nemocnici v Limě (Bath Township, okres Allen, Ohio) na zápal plic a tuberkulózu, nemocný od roku 1935 – podle úmrtního listu Ohio (manželka Mrs. Mary Ropjak, bydliště Lakewood, narozen 18. 12. 1902 v „Trnově“, otec George Ropjak; jako matku nemocnice uvedla „Anna Grega“ – to bylo jméno jeho tety, skutečná matka byla Zuzana Gregová). 7. 10. 1933 podal v Clevelandu prohlášení o úmyslu získat americké občanství (snímek: bydliště 2107 Dowd St., Lakewood, dělník, výška 5 stop 5 palců, * 8. 12. 1902 Tarnov, sňatek s Mary 8. 9. 1925 v Pittsburghu, manželka * 3/1903 v Pensylvánii, děti Helen a John). Smuteční oznámení v novinách The Plain Dealer jmenuje manželku Mary a děti Helen a John. V USA George Ropjak. 17. 9. 1921 připlul z Le Havru lodí SS France do New Yorku (19letý, výška 1,65 m) k strýci Johnu Gregovi, Lily Street, Mansfield, Ohio – příjezd ověřen v originálním seznamu cestujících (Ellis Island, seznam 3, ř. 19: rodiče „Jurej Ropjak, Župa Šarišská, Tarnov“, cíl Mansfield, Ohio). Census 1930: 2068 Quail Avenue, Lakewood, Ohio. Pohřeb 21. 4. 1944 z kostela sv. Cyrila a Metoděje v Lakewoodu, pohřben na Calvary Cemetery v Clevelandu. Web uváděl úmrtí 17. 4. 1944 a pohřeb 21. 4. 1944, MyHeritage 20. 4. 1941 – úmrtní list rozhodl: 17. 4. 1941, pohřeb 21. 4. 1941. Ostatní údaje převzaty z rodokmen1.webnode.cz.</title><rect x="974" y="5618.625" width="236" height="16" rx="4" fill="#f4efe6" stroke="#e2d8c8"></rect><text x="980" y="5630.625" font-size="10.5" fill="#5b4a3a"><tspan fill="#9a8a76">bratr · </tspan>Juraj Ropják (1902–1941)</text></g><g class="tree-chip"><title>Vztah: Agnesa Ropjaková (č. 13) → bratr Juraj Ropják → manželka Mary Fornadelová → otec Andrew Fornadel. Otec Mary Fornadelové. Převzato z rodokmen1.webnode.cz, zatím neověřeno v matrice.</title><rect x="974" y="5637.625" width="236" height="16" rx="4" fill="#f4efe6" stroke="#e2d8c8"></rect><text x="980" y="5649.625" font-size="10.5" fill="#5b4a3a"><tspan fill="#9a8a76">bratr → otec · </tspan>Andrew Fornadel</text></g><g class="tree-chip"><title>Vztah: Agnesa Ropjaková (č. 13) → bratr Juraj Ropják → manželka Mary Fornadelová. * 30. 3. 1903 Pensylvánie (v prameni „Soaf“); × 8. 9. 1925 Pittsburgh Juraj Ropják (podle manželova prohlášení o naturalizaci 1933); † 15. 9. 1989 Garfield Heights, Cuyahoga County, Ohio (index sociálního pojištění USA: Mary F Ropjak * 30. 3. 1903, † 9/1989, Cleveland; smuteční oznámení The Plain Dealer 17. 9. 1989 jmenuje děti Helen Francescangeli a John). Ovdověla roku 1941. Narodila se slovenským rodičům už v Americe (v prameni Mary Fornadela). Převzato z rodokmen1.webnode.cz, zatím neověřeno v matrice. Ve stromu „Koňařík Family Tree“ zapsána jako Maria Fornadela. Žila v Garfield Heights.</title><rect x="974" y="5656.625" width="236" height="16" rx="4" fill="#f4efe6" stroke="#e2d8c8"></rect><text x="980" y="5668.625" font-size="10.5" fill="#5b4a3a"><tspan fill="#9a8a76">bratr → manželka · </tspan>Mary Fornadelová, provd…</text></g><g class="tree-chip"><title>Vztah: Agnesa Ropjaková (č. 13) → bratr Juraj Ropják → dcera Helen Jean Ropjaková. * 25. 7. 1927 Lakewood, Cuyahoga County, Ohio; × Evo Francescangeli, děti Karen a James (podle smutečního oznámení manžela 2017); žena v domácnosti, bydlela v Parmě u Clevelandu; † 31. 3. 2001 Parma, Ohio (73 let), pohřbena v Brook Park, Cuyahoga County. Podle indexu úmrtí státu Ohio 2001 (otec Ropjack, matka Fornadel) a indexu žádostí o sociální pojištění USA (Helen Jean Ropjack, * 25. 7. 1927 Lakewood, otec George Ropjack, matka Mary R. Fornadel) – oba indexy potvrzují, že byla dcerou Juraje a Mary. Census 1930 a 1940: s rodiči a bratrem Johnem v Lakewoodu. Web rodokmen1.webnode.cz uváděl narození 25. 6. 1927 a jméno Helen Jane; strom „Koňařík Family Tree“ 25. 7. 1927 – indexy potvrzují 25. 7. a jméno Jean. Otcovo prohlášení o naturalizaci (1933) uvádí „Helen July 1926“ – rok tam patrně omylem.</title><rect x="974" y="5675.625" width="236" height="16" rx="4" fill="#f4efe6" stroke="#e2d8c8"></rect><text x="980" y="5687.625" font-size="10.5" fill="#5b4a3a"><tspan fill="#9a8a76">bratr → dcera · </tspan>Helen Jean Ropjaková, prov…</text></g><g class="tree-chip"><title>Vztah: Agnesa Ropjaková (č. 13) → bratr Juraj Ropják → syn John Thomas Ropják. * 21. 9. 1929 Lakewood, Cuyahoga County, Ohio; později psán Rojack; bydlel v Tarpon Springs na Floridě; † 10. 7. 2003. Podle indexu žádostí o sociální pojištění USA (John Thomas Ropjak / Rojack, otec George Ropjak, matka Mary Fornadel). Census 1930 a 1940 s rodiči v Lakewoodu; census 1950 už v Clevelandu s manželkou Ninou (* 1930 Illinois; Nina June * 6. 12. 1929) a synem Thomasem R. (* leden 1950). V rodinném stromu veden
