imir Demsky|Katarina Pituch|Martina Pituch|Vladimir Demsky|jméno neuvedeno|Peter Demsky|Marek Pituch|Michaela Pituch|Anna Ropják|Jan Galik|Jozef Galik|Frantisek Galik|Marta Galik|Joszef Spisak|Maria Galik|Peter Galik|Lenka Galik|Harňak|Nellie Simon|Louis S. Oelker|Elizabeth Oelker|Merle Meredith (1926–2009)"><a href="/rodokmen2/osoba/agnesa-ropjakova-1908/"><title>Agnesa Ropjaková 1908–1994 – prababička, údaj od rodiny</title><rect class="tree-card" x="960" y="4221.125" width="250" height="58" rx="8" fill="#fff" stroke="#c9bda9" stroke-dasharray="5 3" stroke-width="1.4"></rect><rect x="960" y="4221.125" width="8" height="58" rx="3" fill="#6FCBB9"></rect><text x="976" y="4244.125" font-size="15" font-weight="600" fill="#3b2e22">Agnesa Ropjaková</text><text x="976" y="4264.125" font-size="12" fill="#7a6b5a">1908–1994 · prababička</text></a><g class="tree-chip"><title>Vztah: Agnesa Ropjaková (č. 13) → bratr Ján Ropják. * 16. 6. 1899 Tarnov čp. 47, okr. Bardejov; × 1926 Anna C. Šafčáková; † 24. 8. 1940 doma v Lakewoodu, 2058 Quail Avenue, Ohio, po nemoci páteře trvající od roku 1931 (pohřben na Calvary Cemetery v Clevelandu 28. 8. 1940) – podle úmrtního listu Ohio, který jmenuje rodiče George Ropjak a Suzan Grega (tedy č. 26 a 27) a manželku Mary Ropjak; datum narození tam „June 16 1899“. Rozpor: úmrtní list, census 1940 (Mary * 1905) i sňatkový index dcery Josephine (matka „Mary Sofcak“) jmenují manželku Mary, ne Annu; Mary Ropjak * 1905, dcera Johna Safcaka a Mary Harnak, se roku 1941 znovu vdala za Martina Vrsanského (index sňatků Ohio). 7. 9. 1923 připlul z Cherbourgu lodí Aquitania na Ellis Island (24letý) k strýci Adamu Gregovi, 151 Daisy Street, Mansfield, Ohio – příjezd ověřen v originálním seznamu cestujících (Ellis Island, seznam C 8, ř. 15: „Father: Mr. Ropjak Juraj in Tarnov 47“, cíl Mansfield, Ohio). Census 1930: Dowd Street, Lakewood, Ohio, bez práce, nemluvil anglicky. Zemřel ve věku 41 let, 2 měsíců a 9 dní (web uváděl 26. 8. 1940, úmrtní list 24. 8.). Ostatní údaje převzaty z rodokmen1.webnode.cz.</title><rect x="974" y="4285.125" width="236" height="16" rx="4" fill="#f4efe6" stroke="#e2d8c8"></rect><text x="980" y="4297.125" font-size="10.5" fill="#5b4a3a"><tspan fill="#9a8a76">bratr · </tspan>Ján Ropják (1899–1940)</text></g><g class="tree-chip"><title>Vztah: Agnesa Ropjaková (č. 13) → bratr Juraj Ropják. * 18. 12. 1902 Tarnov; dělník, později mechanik (Bolt Works); × 8. 9. 1925 Pittsburgh (Pensylvánie) Mary Fornadelová; † 17. 4. 1941 ve státní nemocnici v Limě (Bath Township, okres Allen, Ohio) na zápal plic a tuberkulózu, nemocný od roku 1935 – podle úmrtního listu Ohio (manželka Mrs. Mary Ropjak, bydliště Lakewood, narozen 18. 12. 1902 v „Trnově“, otec George Ropjak; jako matku nemocnice uvedla „Anna Grega“ – to bylo jméno jeho tety, skutečná matka byla Zuzana Gregová). 7. 10. 1933 podal v Clevelandu prohlášení o úmyslu získat americké občanství (snímek: bydliště 2107 Dowd St., Lakewood, dělník, výška 5 stop 5 palců, * 8. 12. 1902 Tarnov, sňatek s Mary 8. 9. 1925 v Pittsburghu, manželka * 3/1903 v Pensylvánii, děti Helen a John). Smuteční oznámení v novinách The Plain Dealer jmenuje manželku Mary a děti Helen a John. V USA George Ropjak. 17. 9. 1921 připlul z Le Havru lodí SS France do New Yorku (19letý, výška 1,65 m) k strýci Johnu Gregovi, Lily Street, Mansfield, Ohio – příjezd ověřen v originálním seznamu cestujících (Ellis Island, seznam 3, ř. 19: rodiče „Jurej Ropjak, Župa Šarišská, Tarnov“, cíl Mansfield, Ohio). Census 1930: 2068 Quail Avenue, Lakewood, Ohio. Pohřeb 21. 4. 1944 z kostela sv. Cyrila a Metoděje v Lakewoodu, pohřben na Calvary Cemetery v Clevelandu. Web uváděl úmrtí 17. 4. 1944 a pohřeb 21. 4. 1944, MyHeritage 20. 4. 1941 – úmrtní list rozhodl: 17. 4. 1941, pohřeb 21. 4. 1941. Ostatní údaje převzaty z rodokmen1.webnode.cz.</title><rect x="974" y="4304.125" width="236" height="16" rx="4" fill="#f4efe6" stroke="#e2d8c8"></rect><text x="980" y="4316.125" font-size="10.5" fill="#5b4a3a"><tspan fill="#9a8a76">bratr · </tspan>Juraj Ropják (1902–1941)</text></g><g class="tree-chip"><title>Vztah: Agnesa Ropjaková (č. 13) → bratr Juraj Ropják → manželka Mary Fornadelová → otec Andrew Fornadel. Otec Mary Fornadelové. Převzato z rodokmen1.webnode.cz, zatím neověřeno v matrice.</title><rect x="974" y="4323.125" width="236" height="16" rx="4" fill="#f4efe6" stroke="#e2d8c8"></rect><text x="980" y="4335.125" font-size="10.5" fill="#5b4a3a"><tspan fill="#9a8a76">bratr → otec · </tspan>Andrew Fornadel</text></g><g class="tree-chip"><title>Vztah: Agnesa Ropjaková (č. 13) → bratr Juraj Ropják → manželka Mary Fornadelová. * 30. 3. 1903 Pensylvánie (v prameni „Soaf“); × 8. 9. 1925 Pittsburgh Juraj Ropják (podle manželova prohlášení o naturalizaci 1933); † 15. 9. 1989 Garfield Heights, Cuyahoga County, Ohio (index sociálního pojištění USA: Mary F Ropjak * 30. 3. 1903, † 9/1989, Cleveland; smuteční oznámení The Plain Dealer 17. 9. 1989 jmenuje děti Helen Francescangeli a John). Ovdověla roku 1941. Narodila se slovenským rodičům už v Americe (v prameni Mary Fornadela). Převzato z rodokmen1.webnode.cz, zatím neověřeno v matrice. Ve stromu „Koňařík Family Tree“ zapsána jako Maria Fornadela. Žila v Garfield Heights.</title><rect x="974" y="4342.125" width="236" height="16" rx="4" fill="#f4efe6" stroke="#e2d8c8"></rect><text x="980" y="4354.125" font-size="10.5" fill="#5b4a3a"><tspan fill="#9a8a76">bratr → manželka · </tspan>Mary Fornadelová, provd…</text></g><g class="tree-chip"><title>Vztah: Agnesa Ropjaková (č. 13) → bratr Juraj Ropják → dcera Helen Jean Ropjaková. * 25. 7. 1927 Lakewood, Cuyahoga County, Ohio; × Evo Francescangeli, děti Karen a James (podle smutečního oznámení manžela 2017); žena v domácnosti, bydlela v Parmě u Clevelandu; † 31. 3. 2001 Parma, Ohio (73 let), pohřbena v Brook Park, Cuyahoga County. Podle indexu úmrtí státu Ohio 2001 (otec Ropjack, matka Fornadel) a indexu žádostí o sociální pojištění USA (Helen Jean Ropjack, * 25. 7. 1927 Lakewood, otec George Ropjack, matka Mary R. Fornadel) – oba indexy potvrzují, že byla dcerou Juraje a Mary. Census 1930 a 1940: s rodiči a bratrem Johnem v Lakewoodu. Web rodokmen1.webnode.cz uváděl narození 25. 6. 1927 a jméno Helen Jane; strom „Koňařík Family Tree“ 25. 7. 1927 – indexy potvrzují 25. 7. a jméno Jean. Otcovo prohlášení o naturalizaci (1933) uvádí „Helen July 1926“ – rok tam patrně omylem.</title><rect x="974" y="4361.125" width="236" height="16" rx="4" fill="#f4efe6" stroke="#e2d8c8"></rect><text x="980" y="4373.125" font-size="10.5" fill="#5b4a3a"><tspan fill="#9a8a76">bratr → dcera · </tspan>Helen Jean Ropjaková, prov…</text></g><g class="tree-chip"><title>Vztah: Agnesa Ropjaková (č. 13) → bratr Juraj Ropják → syn John Thomas Ropják. * 21. 9. 1929 Lakewood, Cuyahoga County, Ohio; později psán Rojack; bydlel v Tarpon Springs na Floridě; † 10. 7. 2003. Podle indexu žádostí o sociální pojištění USA (John Thomas Ropjak / Rojack, otec George Ropjak, matka Mary Fornadel). Census 1930 a 1940 s rodiči v Lakewoodu; census 1950 už v Clevelandu s manželkou Ninou (* 1930 Illinois; Nina June * 6. 12. 1929) a synem Thomasem R. (* leden 1950). V rodinném stromu veden jako žijící – index ukazuje, že zemřel roku 2003 (strom na Ancestry: † Tarpon Springs; manželka Nina, * 1929 Illinois; syn Tom, 1950–2018).</title><rect x="974" y="4380.125" width="236" height="16" rx="4" fill="#f4efe6" stroke="#e2d8c8"></rect><text x="980" y="4392.125" font-size="10.5" fill="#5b4a3a"><tspan fill="#9a8a76">bratr → syn · </tspan>John Thomas Ropják (1929–200…</text></g><g class="tree-chip"><title>Vztah: Agnesa Ropjaková (č. 13) → bratr Ján Ropják → manželka Anna C. Šafčáková → otec Ján Šafčák. * Tarnov; × Harňak. V USA John Safcak; manželka roz. Harňaková (Harnyak), křestní jméno neuvedeno. Převzato z rodokmen1.webnode.cz, zatím neověřeno v matrice.</title><rect x="974" y="4399.125" width="236" height="16" rx="4" fill="#f4efe6" stroke="#e2d8c8"></rect><text x="980" y="4411.125" font-size="10.5" fill="#5b4a3a"><tspan fill="#9a8a76">bratr → manželka · </tspan>Ján Šafčák</text></g><g class="tree-chip"><title>Vztah: Agnesa Ropjaková (č. 13) → bratr Ján Ropják → manželka Anna C. Šafčáková. * 6. 5. 1906 Pensylvánie; třídička (census 1930); × 1926 Ján Ropják; † 21. 2. 2001. V USA Anna C. Safcak. Sestra Mary C. Safcak (* asi 1906) s nimi bydlela v roce 1930. Převzato z rodokmen1.webnode.cz, zatím neověřeno v matrice. Ve stromu „Koňařík Family Tree“ zapsána jako Mary Safcak. Rozpor: rodokmen „Koňařík Family Tree“ uvádí úmrtí 21. 4. 1970. Další manžel podle stromu: Martin Joseph Vrsansky (sňatek 25. 10. 1941, Lakewood, Ohio).</title><rect x="974" y="4418.125" width="236" height="16" rx="4" fill="#f4efe6" stroke="#e2d8c8"></rect><text x="980" y="4430.125" font-size="10.5" fill="#5b4a3a"><tspan fill="#9a8a76">bratr → manželka · </tspan>Anna C. Šafčáková, prov…</text></g><g class="tree-chip"><title>Vztah: Agnesa Ropjaková (č. 13) → bratr Ján Ropják → dcera Josephine Marianne Ropjaková. * 11. 9. 1927 Lakewood, Cuyahoga County, Ohio; × 1. Thomas Leslie Oelker (1950; ovdověla 1960), × 2. Merle Meredith (1926–2009); děti Thomas (1951–2011) a Jayne; † 24. 4. 2024 Middleburg Heights u Clevelandu ve věku 96 let, zádušní mše 29. 4. 2024 v kostele sv. Bartoloměje v Middleburg Heights, pohřbena na hřbitově Holy Cross v Brook Park. Podle smutečního oznámení z 25. 4. 2024 („Josephine M. Meredith (nee Ropjak)“, FamilySearch) a stromu na Ancestry (census 1930, Find a Grave).</title><rect x="974" y="4437.125" width="236" height="16" rx="4" fill="#f4efe6" stroke="#e2d8c8"></rect><text x="980" y="4449.125" font-size="10.5" fill="#5b4a3a"><tspan fill="#9a8a76">bratr → dcera · </tspan>Josephine Marianne Ropjako…</text></g><g class="tree-chip"><title>Vztah: Agnesa Ropjaková (č. 13) → bratr Ján Ropják → dcera Josephine Marianne Ropjaková → manžel Thomas Leslie Oelker. * 26. 3. 1923 Cincinnati, Ohio (odvodní karta 1942, index sociálního pojištění; stromy uvádějí chybně 23. 3. nebo 23. 9.); matka Nellie roz. Simon, podruhé provdaná Schaeuble (Mount Healthy u Cincinnati), otčím Carl Schaeuble. V létě 1942 jako devatenáctiletý pracoval v letecké továrně North American Aviation v Inglewoodu (Kalifornie). Za války nadporučík letectva (Air Corps, č. O-827925), pilot bombardéru B-17; sestřelen asi 21. 1. 1945 (podle rodiny nad Heidelbergem), do května 1945 v zajetí – Stalag Luft III Sagan, pak Norimberk-Langwasser (seznam válečných zajatců USA). Za korejské války znovu povolán k letectvu. × 18. 9. 1950 Allen, Indiana Josephine Marianne Ropjaková, děti Thomas (1951) a Jane Marie. Po válce zkušební pilot firmy Goodyear Aircraft v Akronu, pilot 112. bombardovací letky Letecké národní gardy na letišti Cleveland Hopkins a letový dispečer v Clevelandu, pak pilot aerolinek National Airlines v Miami. V červnu 1958 nastoupil k Federálnímu úřadu letectví (FAA) jako pilot a vedoucí vývojových projektů ve zkušebním středisku NAFEC u Atlantic City; bydlel v Pleasantville (New Jersey), 40 E. Plaza Pl. † pátek 11. 3. 1960 v 9.55 – při zkušebním letu nového přístrojového zařízení pro přistávání se jeho stíhačka F-86D Sabrejet na konečném přiblížení zřítila do lesa u Absecon Highlands necelou míli před přistávací dráhou a rozlomila se na tři části; byla to první letecká oběť střediska. Pohřben z kostela sv. Wendelína v Clevelandu. Podle novinových článků z Atlantic City (12. 3. 1960) a Clevelandu (newspapers.com, poslal Luděk); index úmrtí sociálního pojištění: † 3/1960. Smuteční oznámení „Thomas L. Oelker, Major USAF“ vyšlo 1960 v The Plain Dealer (Cleveland) – jmenuje manželku Josephine, děti Thomase ml. a Jane Marii, matku a otčíma Schaeubleovy, bratra Roberta a sestru paní Mary Pinderovou (podle indexu FamilySearch; text oznámení je v placeném archivu GenealogyBank). Rodinné vyprávění, že zahynul jako zkušební pilot při testování letadla, novinové články potvrdily.</title><rect x="974" y="4456.125" width="236" height="16" rx="4" fill="#f4efe6" stroke="#e2d8c8"></rect><text x="
